[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabu-companion"
version = "0.1.0"
description = "A small desktop companion with a 3D character and reminders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15.7",
    "pyttsx3>=2.90",
]

[project.gui-scripts]
rabu-companion = "rabu_companion.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rabu_companion*"]

[tool.setuptools.package-data]
rabu_companion = ["assets/*.glb", "assets/*.png"]
